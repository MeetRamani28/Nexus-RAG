name: Keep Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -f -m 15 "https://${{ secrets.RENDER_BACKEND_HOST || 'nexus-rag-7djz.onrender.com' }}/healthz" || true
