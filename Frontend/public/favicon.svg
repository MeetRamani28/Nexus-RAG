<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd0b8" />
      <stop offset="50%" stop-color="#948979" />
      <stop offset="100%" stop-color="#dfd0b8" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd0b8" />
      <stop offset="100%" stop-color="#948979" />
    </linearGradient>
  </defs>

  <!-- Orbit Ring (#DFD0B8) -->
  <ellipse cx="50" cy="50" rx="42" ry="18" fill="none" stroke="#dfd0b8" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.85" transform="rotate(-25 50 50)" />

  <!-- Outer 3D Octahedron Wireframe (#948979 - Warm Bronze Gold) -->
  <polygon points="50,10 85,50 50,90 15,50" fill="none" stroke="url(#nexusGrad)" stroke-width="3.5" />
  <line x1="50" y1="10" x2="50" y2="90" stroke="url(#nexusGrad)" stroke-width="2.5" opacity="0.7" />
  <line x1="15" y1="50" x2="85" y2="50" stroke="url(#nexusGrad)" stroke-width="2.5" opacity="0.7" />

  <!-- Inner Solid Glowing Diamond Core (#DFD0B8 - Soft Cream Gold) -->
  <polygon points="50,28 72,50 50,72 28,50" fill="url(#coreGrad)" opacity="0.95" />
  <polygon points="50,28 50,72 72,50" fill="#ebe2d3" opacity="0.5" />

  <!-- Center Spark Core -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
</svg>