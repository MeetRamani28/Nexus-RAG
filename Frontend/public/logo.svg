<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Luminous Cream Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E4" />
      <stop offset="40%" stop-color="#E1DCC9" />
      <stop offset="75%" stop-color="#C5BAA2" />
      <stop offset="100%" stop-color="#948979" />
    </linearGradient>

    <!-- Warm Amber Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="35%" stop-color="#E8E2D2" />
      <stop offset="70%" stop-color="#DFD0B8" />
      <stop offset="100%" stop-color="#A69B88" />
    </linearGradient>

    <!-- Shadow / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E1DCC9" flood-opacity="0.35" />
    </filter>

    <!-- Deep Ambient Glow -->
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1DCC9" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#948979" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#ambient)" />

  <!-- Outer Orbiting Ring 1 (Dashed Cream Gold) -->
  <ellipse cx="256" cy="256" rx="215" ry="90" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="32 16" stroke-linecap="round" opacity="0.9" transform="rotate(-28 256 256)" filter="url(#glow)" />

  <!-- Outer 3D Octahedron Wireframe Outer Diamond -->
  <polygon points="256,48 440,256 256,464 72,256" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Wireframe Structural Cross Lines -->
  <line x1="256" y1="48" x2="256" y2="464" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  <line x1="72" y1="256" x2="440" y2="256" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.8" />

  <!-- Facet Fill (Subtle warm translucent slate) -->
  <polygon points="256,48 440,256 256,256" fill="#E1DCC9" fill-opacity="0.08" />
  <polygon points="72,256 256,464 256,256" fill="#948979" fill-opacity="0.12" />

  <!-- Inner Solid Glowing Diamond Core -->
  <polygon points="256,140 372,256 256,372 140,256" fill="url(#coreGrad)" stroke="#FFF8EE" stroke-width="6" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Diamond Shading Facet for 3D depth -->
  <polygon points="256,140 256,372 372,256" fill="#FFFFFF" fill-opacity="0.32" />
  <polygon points="140,256 256,372 256,256" fill="#948979" fill-opacity="0.25" />

  <!-- Center Luminous Spark Core -->
  <circle cx="256" cy="256" r="28" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#FFFDF8" />
</svg>
